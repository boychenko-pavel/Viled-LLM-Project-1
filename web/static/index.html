<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Viled ATLAS LLM Project</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <section id="loginScreen" class="login-screen" aria-label="Viled ATLAS login">
      <svg
        class="neural-field"
        viewBox="0 0 1600 900"
        preserveAspectRatio="none"
        aria-hidden="true"
      >
        <defs>
          <linearGradient id="neuralLine" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#21d07a" />
            <stop offset="0.52" stop-color="#6ee7f9" />
            <stop offset="1" stop-color="#f4c95d" />
          </linearGradient>
          <radialGradient id="neuralNode" cx="50%" cy="50%" r="50%">
            <stop offset="0" stop-color="#ffffff" />
            <stop offset="0.42" stop-color="#6ee7f9" />
            <stop offset="1" stop-color="#21d07a" stop-opacity="0" />
          </radialGradient>
        </defs>
        <g class="neural-web neural-web-back">
          <path d="M-40 720 C 170 650 250 430 440 470 S 760 700 940 560 1190 250 1640 300" />
          <path d="M-20 220 C 180 270 280 130 470 180 S 780 420 960 330 1260 90 1620 130" />
          <path d="M90 900 C 260 710 430 730 560 560 S 760 260 990 220 1260 390 1510 40" />
          <path d="M135 80 C 260 285 390 310 560 260 S 930 80 1110 210 1300 590 1580 660" />
          <path d="M0 510 C 210 405 390 565 600 465 S 920 125 1130 340 1320 505 1600 455" />
        </g>
        <g class="neural-web neural-web-front">
          <path d="M170 690 L320 540 L505 600 L710 430 L930 515 L1125 360 L1350 410" />
          <path d="M240 250 L420 325 L610 210 L790 330 L1030 245 L1225 315 L1470 200" />
          <path d="M395 795 L510 600 L650 725 L830 575 L1010 665 L1185 515 L1435 565" />
          <path d="M105 420 L320 540 L420 325 L610 210 L710 430 L930 515 L1030 245" />
        </g>
        <g class="neural-nodes">
          <circle cx="105" cy="420" r="9" />
          <circle cx="170" cy="690" r="12" />
          <circle cx="240" cy="250" r="10" />
          <circle cx="320" cy="540" r="13" />
          <circle cx="420" cy="325" r="11" />
          <circle cx="505" cy="600" r="9" />
          <circle cx="610" cy="210" r="14" />
          <circle cx="650" cy="725" r="10" />
          <circle cx="710" cy="430" r="16" />
          <circle cx="790" cy="330" r="8" />
          <circle cx="930" cy="515" r="13" />
          <circle cx="1030" cy="245" r="12" />
          <circle cx="1125" cy="360" r="10" />
          <circle cx="1185" cy="515" r="9" />
          <circle cx="1225" cy="315" r="13" />
          <circle cx="1350" cy="410" r="15" />
          <circle cx="1435" cy="565" r="10" />
          <circle cx="1470" cy="200" r="12" />
        </g>
      </svg>

      <div class="login-panel">
        <img
          class="login-logo"
          src="/static/Viled%20Atlas%20Logo%202.png"
          alt="Viled Atlas"
        />
        <h1 class="project-main-title">VILED ATLAS </h1>
        <h1 class="project-version-title">LLM PROJECT v.1</h1>
        <form id="loginForm" class="login-form">
          <label for="loginName">Login</label>
          <input id="loginName" type="text" autocomplete="username" />
          <label for="loginPassword">Password</label>
          <input id="loginPassword" type="password" autocomplete="current-password" />
          <button type="submit">Enter</button>
        </form>
      </div>
    </section>

    <div id="appShell" class="app-shell is-hidden">
      <aside class="sidebar" aria-label="Рабочая область агента">
        <div class="brand">
          <div class="brand-mark">V</div>
          <div>
            <div class="brand-name">Viled ATLAS LLM Project</div>
            <div class="brand-subtitle">Local agent team</div>
          </div>
        </div>

        <section class="workspace">
          <div class="section-label">Agents</div>
          <button class="workspace-item active" type="button" data-workspace="bi_analytics">
            <span class="item-icon">SQL</span>
            <span>
              <strong>SQL Analytic</strong>
              <small>Prices & sales</small>
            </span>
          </button>
          <button class="workspace-item" type="button" data-workspace="office_manager">
            <span class="item-icon">OM</span>
            <span>
              <strong>Office Manager</strong>
              <small>General LLM chat</small>
            </span>
          </button>
          <button class="workspace-item" type="button" data-workspace="forecast_sales">
            <span class="item-icon">FC</span>
            <span>
              <strong>Forecast Sales</strong>
              <small>Monthly forecast</small>
            </span>
          </button>
          <button class="workspace-item" type="button" data-workspace="currency">
            <span class="item-icon">FX</span>
            <span>
              <strong>Currency</strong>
              <small>mig.kz rates</small>
            </span>
          </button>
          <button class="workspace-item" type="button" data-workspace="hr">
            <span class="item-icon">HR</span>
            <span>
              <strong>HR</strong>
              <small>Bonus policies</small>
            </span>
          </button>
        </section>

        <section class="panel">
          <div class="section-label">Status</div>
          <div class="status-row">
            <span>Agent</span>
            <strong>Ready</strong>
          </div>
          <div class="status-row">
            <span>Model</span>
            <strong id="modelName">...</strong>
          </div>
          <div class="status-row">
            <span>Memory</span>
            <strong>Local</strong>
          </div>
        </section>

        <section class="panel examples">
          <div class="section-label">Quick asks</div>
          <button type="button" data-prompt="Покажи последние 10 цен">Последние цены</button>
          <button type="button" data-prompt="Покажи продажи за последнюю дату">Продажи за дату</button>
          <button type="button" data-prompt="Сделай прогноз продаж на 1 год по месяцам">Прогноз продаж</button>
          <button type="button" data-prompt="Какие таблицы доступны?">Схема данных</button>
        </section>

        <button id="resetButton" class="ghost-button" type="button">Очистить память</button>
        <section id="hrUploadPanel" class="panel hr-upload-panel hidden">
          <div class="section-label">HR Documents</div>
          <form id="hrUploadForm" class="hr-upload-form">
            <input id="hrPdfInput" type="file" accept="application/pdf,.pdf" />
            <button id="hrUploadButton" type="submit">Embed PDF</button>
          </form>
          <div id="hrUploadStatus" class="hr-upload-status"></div>
        </section>
      </aside>

      <main class="chat-area">
        <header class="chat-header">
          <div>
            <p id="workspaceEyebrow" class="eyebrow">Agent Team</p>
            <h1 id="workspaceTitle">Чат с агентом</h1>
          </div>
          <div class="connection-pill">
            <span class="pulse"></span>
            Local
          </div>
        </header>

        <section id="messages" class="messages" aria-live="polite"></section>

        <section id="hrMemoryPanel" class="hr-memory-panel hidden" aria-label="HR memory browser">
          <div class="hr-memory-header">
            <div>
              <div class="section-label">HR Memory</div>
              <strong id="hrMemorySummary">No documents</strong>
            </div>
            <button id="hrMemoryRefreshButton" type="button">Refresh</button>
          </div>
          <div class="hr-memory-tools">
            <select id="hrDocumentSelect" aria-label="HR document"></select>
            <form id="hrSearchForm" class="hr-search-form">
              <input id="hrSearchInput" type="search" placeholder="Search HR memory..." />
              <button id="hrSearchButton" type="submit">Search</button>
            </form>
          </div>
          <div id="hrChunkList" class="hr-chunk-list"></div>
        </section>

        <form id="chatForm" class="composer">
          <textarea
            id="messageInput"
            rows="1"
            maxlength="4000"
            placeholder="Спросите про цены, продажи, валюты или схему..."
            autocomplete="off"
          ></textarea>
          <button id="copyInputButton" class="copy-input-button" type="button" aria-label="Copy input">
            Copy
          </button>
          <button id="sendButton" type="submit" aria-label="Отправить">
            <span>➜</span>
          </button>
        </form>
      </main>
    </div>

    <script src="/static/app.js?v=currency-20260618"></script>
  </body>
</html>
